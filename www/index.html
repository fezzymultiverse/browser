<html lang="en" data-eff="light">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#0c0809">
<title>Festers Browser</title>
<style>
:root{--accent:#ff2d3d;--hi:#ff8a1f;--ink:#fff;--bg:#0c0809;--s1:#151011;--s2:#1f1618;--s3:#2b1d20;--tx:#f7f2f2;--mu:#a39a9c;--bd:#36232a;--ol:#36232a;--ok:#35d07f;--bad:#ff4d4d;--rail:58px}
[data-eff="light"]{--bg:#ffffff;--s1:#fafafa;--s2:#f1f1f2;--s3:#e3e3e7;--tx:#111113;--mu:#55555e;--bd:#d9d9de;--ol:#111113;--hi:#ff8a1f;--ok:#12a150;--bad:#e11d2e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
a{color:var(--accent)}
.mu{color:var(--mu)}
#app{display:flex;flex-direction:column;height:100dvh}
#top{position:relative;flex:none;background:var(--s1);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top)}
#tabstrip{display:flex;align-items:flex-end;gap:4px;padding:6px 8px 0;background:var(--bg)}
#tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
#tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;min-width:112px;max-width:210px;flex:0 0 auto;padding:8px 6px 8px 10px;border-radius:10px 10px 0 0;color:var(--mu);cursor:pointer;border-top:2px solid transparent;font-size:12.5px}

.tab .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .tx{width:20px;height:20px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:inherit;padding:0}
.tab .tx:hover{background:var(--s3)}
.fav{width:16px;height:16px;border-radius:50%;background:var(--accent);color:var(--ink);font-size:10px;font-weight:700;display:grid;place-items:center;flex:none;text-transform:uppercase}

#toolbar{display:flex;align-items:center;gap:2px;padding:6px 8px}

.bm{flex:none;max-width:160px;padding:4px 10px;border:1px solid var(--bd);background:var(--s2);border-radius:999px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#sugg{position:absolute;left:8px;right:8px;top:100%;z-index:40;background:var(--s1);border:1px solid var(--bd);border-radius:14px;box-shadow:0 14px 40px #0009;padding:6px;display:none;max-height:60vh;overflow:auto}

.sg>div{min-width:0;flex:1}
#stage{flex:1;display:flex;min-height:0;position:relative}
#views{flex:1;min-width:0;position:relative}
.view{position:absolute;inset:0;display:none;overflow:auto;background:var(--bg)}
.view.on{display:block}
.view.web{overflow:hidden}
.frame{display:flex;flex-direction:column;height:100%}
.frame iframe{flex:1;min-height:0;width:100%;border:0;background:#fff}
.darkpages .frame iframe{filter:invert(1) hue-rotate(180deg)}
.fbar{display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--s1);border-bottom:1px solid var(--bd);font-size:12px;color:var(--mu)}

.ncf{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 14%,var(--s1)),var(--s1))!important}

@keyframes prog{to{width:92%}}
#drawer{display:none;width:390px;flex:none;background:var(--s1);border-left:1px solid var(--bd);flex-direction:column;min-height:0}

.dh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--bd);flex:none}

.db{flex:1;overflow:auto;padding:12px;min-height:0}
#rail{flex:none;width:var(--rail);background:var(--s1);border-left:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0}
.rlogo{padding:2px 0 8px}

.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--s2);color:var(--tx)}

.btn.bad{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.in{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;color:var(--tx);font:inherit}

label.lb{display:block;margin:10px 0 4px;font-size:12px;color:var(--mu)}
#menu{position:fixed;right:8px;top:calc(env(safe-area-inset-top) + 92px);width:300px;max-height:78dvh;overflow:auto;background:var(--s1);border:1px solid var(--bd);border-radius:14px;box-shadow:0 14px 44px #000a;padding:6px;display:none;z-index:60}

.mi em{margin-left:auto;font-style:normal;font-size:11px;color:var(--mu)}
.hr{height:1px;background:var(--bd);margin:6px 2px}

.modal{background:var(--s1);border:1px solid var(--bd);border-radius:16px;width:min(470px,100%);max-height:92dvh;overflow:auto;padding:16px}

.sw{position:relative;display:inline-block;width:44px;height:26px;flex:none}

.nsearch{display:flex;align-items:center;gap:10px;width:min(620px,100%);margin:20px 0 8px;background:var(--s2);border:1px solid var(--bd);border-radius:999px;padding:0 8px 0 18px;height:52px}

.sc{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px;width:min(640px,100%);margin-top:26px}

.blocked{max-width:460px;margin:0 auto;padding:10vh 20px;text-align:center}

.pref{display:flex;min-height:100%}

.pmain{flex:1;min-width:0;padding:16px 22px 40px;max-width:780px}

.pref.finding .sect{display:block}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--bd)}
.row .rt{min-width:0}

.swc.on{border-color:var(--tx)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.hist{max-width:760px;margin:0 auto;padding:16px}
.li{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--bd)}
.li>div{flex:1;min-width:0;cursor:pointer}
.li b,.li small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li small{color:var(--mu)}
.vp{display:flex;flex-direction:column;gap:10px}
.vhero{text-align:center;padding:10px 0}
.meter{height:5px;background:var(--s3);border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--bad);transition:.2s}

.vh{display:flex;align-items:center;gap:10px;padding:10px;cursor:pointer}

.vm{flex:1;min-width:0}

.ring{width:28px;height:28px;transform:rotate(-90deg)}

.vd{padding:2px 10px 10px;border-top:1px solid var(--bd)}
.fr{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--bd)}

.fr .v.mono{font-family:ui-monospace,Menlo,Consolas,monospace}

.row2{display:flex;gap:6px;align-items:center}
.row2 .in{flex:1}

 #stage{flex-direction:column}

}

#fbline{position:fixed;top:0;left:0;right:0;height:2px;pointer-events:none;z-index:99997;opacity:0;background:linear-gradient(90deg,transparent 0,#00e5ff 30%,#fff 50%,#00e5ff 70%,transparent 100%);background-size:40% 100%;background-repeat:no-repeat;box-shadow:0 0 10px #00e5ff}
html.fbld #fbline{opacity:1;animation:fbRun 1.1s ease-in-out infinite}
@keyframes fbRun{from{background-position:-40% 0}to{background-position:140% 0}}
#fbpaw{display:none;flex:none;place-items:center;color:#00e5ff;filter:drop-shadow(0 0 4px #00e5ff)}
#fbpaw svg{fill:currentColor;stroke:none}
html.fbld #fbpaw{display:grid;animation:fbPulse .8s ease-in-out infinite}
@keyframes fbPulse{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.2);opacity:1}}
/* vault unlocked: purple glow around the app */
html.vopen body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:99996;border-radius:2px;box-shadow:inset 0 0 0 2px #b66cff,inset 0 0 20px 3px rgba(182,108,255,.5);animation:fbVG 3s ease-in-out infinite}
@keyframes fbVG{0%,100%{opacity:.65}50%{opacity:1}}
/* tab colour groups */
.tab.hasc{box-shadow:inset 0 3px 0 var(--tc)}
.tab .tgn{font-style:normal;font-size:10px;font-weight:800;margin-right:2px;max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcsw{display:flex;flex-wrap:wrap;gap:10px}
.tcb{width:40px;height:40px;border-radius:50%;border:2px solid transparent;background:var(--c,var(--s3));display:grid;place-items:center;color:#000;font-size:11px;font-weight:800;padding:0}
.tcb.none{background:var(--s3);color:var(--tx)}
.tcb.on{border-color:var(--tx);box-shadow:0 0 0 3px var(--bg),0 0 12px var(--c,#888)}
/* Kill Switch / Scorch / Burn / Blaze tiles under the clock */
.ntzone{display:flex;flex-direction:row;gap:7px;width:100%;max-width:440px;margin:44px 0 0;position:relative;z-index:3}
.zb{flex:1 1 0;min-width:0;height:56px;justify-content:center;border:1px solid var(--bd);background:var(--s2);color:var(--tx);border-radius:12px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;position:relative;overflow:hidden}
.zb i{display:grid;place-items:center;font-style:normal}
.zb span{color:var(--tx);font-size:9px;font-weight:800;letter-spacing:.2px;line-height:1.1;text-align:center}
.zb.zks{border-color:rgba(0,229,255,.55);color:#00e5ff;box-shadow:0 0 10px rgba(0,229,255,.35)}
.zb.zks i{animation:zbSpark 1.3s steps(2,end) infinite}
.zb.zsc{border-color:rgba(255,138,31,.6);color:#ff8a1f;box-shadow:0 0 10px rgba(255,138,31,.35)}
.zb.zsc i{animation:zbEmber 1.8s ease-in-out infinite}
.zb.zbu{border-color:rgba(255,45,61,.65);color:#ff4d4d;box-shadow:0 0 12px rgba(255,45,61,.45)}
.zb.zbu i{animation:zbFlame .9s ease-in-out infinite}
.zb.zbz{border-color:rgba(255,95,10,.7);color:#ffb347;background:linear-gradient(180deg,var(--s2),rgba(255,60,0,.18));box-shadow:0 0 14px rgba(255,80,0,.5)}
.zb.zbz i{animation:zbFlame .7s ease-in-out infinite}
.zb:active{transform:scale(.93)}
@keyframes zbSpark{0%{filter:drop-shadow(0 0 2px #00e5ff);transform:translate(0,0)}50%{filter:drop-shadow(0 0 9px #fff);transform:translate(1px,-1px) rotate(4deg)}}
@keyframes zbEmber{0%,100%{filter:drop-shadow(0 0 2px #ff8a1f);opacity:.85}50%{filter:drop-shadow(0 0 8px #ff8a1f);opacity:1}}
@keyframes zbFlame{0%,100%{transform:scale(1) translateY(0);filter:drop-shadow(0 0 3px #ff2d3d)}50%{transform:scale(1.15) translateY(-1px);filter:drop-shadow(0 0 9px #ff8a1f)}}
/* full-screen effect layers */
.fbfx{position:fixed;inset:0;z-index:99999;pointer-events:none;overflow:hidden}
.fbfx canvas{position:absolute;inset:0;width:100%;height:100%}
.fbfxlab{position:absolute;left:0;right:0;top:38%;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:28px;font-weight:900;letter-spacing:5px;opacity:0;text-align:center}
.fbfxlab small{font-size:11px;font-weight:600;letter-spacing:1px;opacity:.85}
.fbfxlab.fks{color:#e8fdff;text-shadow:0 0 12px #00e5ff,0 0 26px #00e5ff}
.fbfxlab.fbz{color:#fff3d0;text-shadow:0 0 12px #ff8a1f,0 0 28px #ff2d3d}
.bzhead{display:flex;align-items:center;gap:10px;color:#ff8a1f;font-size:22px}
.bzhead b{color:var(--tx)}
.pvbox{max-height:62vh;overflow:auto;padding-right:4px;font-size:13.5px;line-height:1.5}
.pvbox p{margin:0 0 10px}
.pvico{display:grid;place-items:center;margin-bottom:8px;filter:drop-shadow(0 0 10px rgba(0,229,255,.55))}

/* V1.23.9: orange handle on the bottom bar, swipe-up quick sheet, Kill Switch prompt and effect */
#rail::after{content:"";position:absolute;top:0;left:50%;width:46px;height:4px;margin-left:-23px;border-radius:0 0 4px 4px;background:#ff8a1f;pointer-events:none}
#ksheet{position:fixed;inset:0;z-index:90;display:none}
#ksheet.on{display:block}
#ksheet .kbg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#ksheet .kpan{position:absolute;left:0;right:0;bottom:0;background:var(--s1);color:var(--tx);border-top:1px solid var(--bd);border-radius:18px 18px 0 0;padding:6px 14px calc(14px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s ease;max-height:86dvh;overflow:auto}
#ksheet.on .kpan{transform:none}
#ksheet .kgrip{width:46px;height:4px;border-radius:4px;background:#ff8a1f;margin:4px auto 10px}
#ksheet h3{margin:0 0 8px;font-size:15px;text-align:center}
#ksheet .kit{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;margin:6px 0;border:1px solid var(--bd);border-radius:14px;background:var(--s2);color:var(--tx);font:inherit}
#ksheet .kit i{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--s3);font-style:normal;flex:none}
#ksheet .kit span{display:flex;flex-direction:column;min-width:0}
#ksheet .kit b{font-size:15px}
#ksheet .kit small{color:var(--mu);font-size:12px;line-height:1.25}
#ksheet .kit:active{transform:scale(.98)}
.ksdlg{text-align:center}
.ksdlg .ksico{color:#ffb347;display:grid;place-items:center;margin:2px 0 6px;filter:drop-shadow(0 0 10px rgba(255,190,80,.6))}
.ksdlg p{margin:0 0 8px}
.fbks .ks-dark{position:absolute;inset:0;background:#000;opacity:0}
.fbks .ks-light{position:absolute;left:50%;top:44%;width:130vmin;height:130vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,244,205,.6) 0%,rgba(255,214,120,.24) 28%,rgba(255,170,60,.08) 52%,transparent 70%);opacity:0;transform:translate(-50%,-50%);pointer-events:none}
.fbks .ks-card{position:absolute;left:50%;top:44%;width:min(80vw,340px);box-sizing:border-box;padding:22px 18px;border-radius:18px;background:rgba(16,16,20,.94);border:1px solid rgba(255,214,120,.55);box-shadow:0 0 30px rgba(255,200,100,.35);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:#fff3d0;opacity:0;transform:translate(-50%,-50%)}
.fbks .ks-card b{font:900 20px system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 12px rgba(255,170,60,.7)}
.fbks .ks-card small{font:700 11px system-ui,sans-serif;letter-spacing:.3em;color:#ffcf8a}
.fbks .ks-card i{color:#ffb347;display:grid;place-items:center;filter:drop-shadow(0 0 12px rgba(255,170,60,.8))}
</style>
</head>

   the mirror is put back and the page reloads once, so bookmarks, collections, notes, settings and the encrypted vault do not disappear. */
(function(){try{
 var C=window.Capacitor,FS=C&&C.Plugins&&C.Plugins.Filesystem;
 if(!FS||localStorage.getItem('fb:settings')!==null||sessionStorage.getItem('fb:restored'))return;

 FS.readFile({path:'fb-state.json',directory:'DATA',encoding:'utf8'}).then(function(r){
  var o=JSON.parse(r.data||'{}'),n=0;
  Object.keys(o).forEach(function(k){if(k.indexOf('fb:')===0){localStorage.setItem(k,o[k]);n++}});
  if(n)location.reload();
 }).catch(function(){});
}catch(e){}})();

function renderHistory(t){
 const draw=q=>{
  q=(q||'').toLowerCase();
  const list=H.filter(h=>!q||(h.url+' '+h.title).toLowerCase().includes(q)).slice(0,300);
  let day='',html='';
  list.forEach(h=>{const d=new Date(h.t).toDateString();if(d!==day){day=d;html+=`<div class="mh" style="padding:14px 6px 4px">${esc(d)}</div>`}
   html+=`<div class="li"><div data-go="${esc(h.url)}"><b>${esc(h.title)}</b><small>${esc(h.url)}</small></div><small class="mu">${new Date(h.t).toTimeString().slice(0,5)}</small><button class="ib" data-del="${h.t}" aria-label="Delete">${ic('close',16)}</button></div>`});
  $('#hl',t.el).innerHTML=html||'<p class="mu" style="text-align:center;padding:30px">Nothing here yet.</p>';
 };
 t.el.innerHTML=`<div class="hist"><div class="row2" style="margin-bottom:8px"><h2 style="margin:0;flex:1">History</h2><button class="btn bad sm" id="hclr">Clear all</button></div><input class="in" id="hq" placeholder="Search history"><div id="hl"></div></div>`;
 draw();
 $('#hq',t.el).oninput=e=>draw(e.target.value);
 $('#hclr',t.el).onclick=async()=>{if(await confirmBox('Delete all browsing history?','Delete')){H=[];LS.set('history',H);draw()}};
 $('#hl',t.el).onclick=e=>{const d=e.target.closest('[data-del]');if(d){H=H.filter(h=>String(h.t)!==d.dataset.del);LS.set('history',H);draw($('#hq',t.el).value)}};
}
function renderBookmarks(t){
 const draw=()=>{
  $('#bl',t.el).innerHTML=B.length?B.map((b,i)=>`<div class="li"><div data-go="${esc(b.url)}"><b>${esc(b.title)}</b><small>${esc(b.url)}</small></div><button class="ib" data-ed="${i}" aria-label="Rename">${ic('edit',16)}</button><button class="ib" data-bd="${i}" aria-label="Delete">${ic('trash',16)}</button></div>`).join(''):'<p class="mu" style="text-align:center;padding:30px">No bookmarks yet. Tap the star in the address bar.</p>';
 };
 t.el.innerHTML=`<div class="hist"><div class="row2" style="margin-bottom:8px"><h2 style="margin:0;flex:1">Bookmarks</h2><button class="btn sm" id="bex">Export</button><button class="btn sm" id="bim">Import</button></div><div id="bl"></div></div>`;
 draw();
 $('#bl',t.el).onclick=async e=>{
  const d=e.target.closest('[data-bd]'),ed=e.target.closest('[data-ed]');
  if(d){B.splice(+d.dataset.bd,1);LS.set('bookmarks',B);renderBm();draw()}
  if(ed){const b=B[+ed.dataset.ed];const r=await askFields('Rename bookmark',[{k:'t',label:'Title',value:b.title}]);if(r&&r.t){b.title=r.t;LS.set('bookmarks',B);renderBm();draw()}}
 };
 $('#bex',t.el).onclick=()=>download('festers-bookmarks.json',JSON.stringify(B,null,1));
 $('#bim',t.el).onclick=async()=>{
  const txt=await pickFile('.json');if(!txt)return;
  try{const a=JSON.parse(txt);if(!Array.isArray(a))throw 0;let n=0;a.forEach(b=>{if(b&&isWeb(b.url)&&!isBm(b.url)){B.push({url:b.url,title:String(b.title||host(b.url)),t:Date.now()});n++}});LS.set('bookmarks',B);renderBm();draw();toast(n+' imported')}catch(e){toast('Not a valid bookmarks file')}
 };
}

async function sysAction(action,t){
 const P=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.FBSys;
 if(!P)return toast('Android system controls are available in the installed app');
 try{
  if(action==='sysnotif'){
   if(P.askNotifications){
    const r=await P.askNotifications();
    if(r&&r.granted)toast('Notifications are allowed.');
    else if(r&&r.blocked){if(await confirmBox('Android will not show the notification prompt again. Open app settings to allow notifications?','Open settings')){await P.appSettings()}}
    else toast('Notifications were not allowed. You can change this in app settings.');
   }else{await P.requestNotifications();toast('Android notification permission requested. Check the system prompt or app settings.');}
  }
  else if(action==='sysdefault'){const r=await P.chooseDefaultBrowser();if(!r||!r.ok)throw new Error('Could not open default browser settings');
   if(r.held){S.askedDefault=true;LS.set('settings',S);toast(r.already?'Festers is already your default browser.':'Festers is now your default browser.')}
   else toast('Pick Festers Browser under Browser app in the list.')}
  else if(action.startsWith('sysperm_')){
   const n=action.slice(8);if(!P.askPerm)throw new Error('Needs the new app version');
   const r=await P.askPerm({name:n});
   if(r&&r.granted)toast('Allowed.');
   else if(r&&r.pending){toast('Answer the Android prompt, then tap Check status.')}
   else if(r&&r.blocked){if(await confirmBox('Android will not ask again. Open app settings and allow it there?','Open settings')){await P.appSettings()}}
   else if(r&&r.ok===false)throw new Error(r.error||'Could not ask Android');
   else toast('Not allowed. You can change this in app settings.');
  }
  else if(action==='syspermstat'){
   if(!P.permStatus)throw new Error('Needs the new app version');
   const r=await P.permStatus();const y=v=>v?'Allowed':'Not allowed';
   modal('Android permissions',['Camera|camera','Microphone|microphone','Location|location','Photos & media|media','Notifications|notifications'].map(x=>{const a=x.split('|');return `<p class="mu" style="margin:0 0 6px">${a[0]}: <b>${y(r[a[1]])}</b></p>`}).join('')+`<p class="mu" style="margin:8px 0 0">Passkeys: open Passkey management on this page for the browser-origin permission and your passkey manager.</p>`,[{label:'Close'}]);
  }
  else if(action==='syspkprov'){
   if(P.openPasskeySettings){const r=await P.openPasskeySettings();if(!r||!r.ok)throw new Error((r&&r.error)||'Could not open passkey settings');
    toast(r.fallback?'Open Settings > Passwords, passkeys & autofill and pick your passkey manager.':'Pick your passkey manager, then come back.')}
   else if(P.openAutofillSettings){const r=await P.openAutofillSettings();if(!r||!r.ok)throw new Error((r&&r.error)||'Could not open autofill settings');toast('Open Settings > Passwords, passkeys & autofill and pick your passkey manager.')}
   else throw new Error('Needs the new app version');
  }
  else if(action==='syspkperm'||action==='syspktrust'){
   if(!P.autofillStatus)throw new Error('Needs the new app version');
   const r=await P.autofillStatus();let st=null;try{if(P.status)st=await P.status()}catch(e){}
   const y=v=>v?'Yes':'No';
   if(action==='syspktrust'){
    if(!r.pkg)throw new Error('Could not read the app identity');
    const txt='Festers Browser\npackage: '+r.pkg+'\nSHA-256: '+(r.cert||'unknown');
    await copyText(txt);toast(r.cert?'Package and fingerprint copied':'Package copied. The fingerprint could not be read.');return;
   }
   const sdk=Number(r.sdk||0),api34=sdk>=34;
   const need=!r.originDeclared?'The build does not declare the browser-origin permission. Rebuild with the current setup script.':!api34?'Android 14 or newer is needed for the browser-origin permission. On this Android version passkey apps may not offer passkeys to a browser.':!r.originGranted?'Android has not granted the browser-origin permission. Festers cannot grant it itself: Android only gives it to browsers it trusts, so some sites may refuse passkeys here. Use your passkey app\'s own page or Outside for those sign-ins.':'Android granted the browser-origin permission.';
   modal('Passkey permissions',`<p class="mu" style="margin:0 0 6px">Android version (API): <b>${esc(String(sdk||'unknown'))}</b></p><p class="mu" style="margin:0 0 6px">Browser-origin permission declared: <b>${y(r.originDeclared)}</b></p><p class="mu" style="margin:0 0 6px">Browser-origin permission granted: <b>${y(r.originGranted)}</b></p><p class="mu" style="margin:0 0 6px">Autofill service switched on: <b>${y(r.enabled)}</b></p>${st?`<p class="mu" style="margin:0 0 6px">Festers is the default browser: <b>${y(st.defaultBrowser)}</b></p>`:''}<p class="mu" style="margin:0 0 6px">Package: <b>${esc(String(r.pkg||'unknown'))}</b></p><p class="mu" style="margin:0 0 8px;word-break:break-all">Signing certificate SHA-256: <b>${esc(String(r.cert||'could not be read'))}</b></p><p class="mu" style="margin:0">${need}</p>`,
    [{label:'Passkey manager',fn:()=>{Promise.resolve().then(()=>P[P.openPasskeySettings?'openPasskeySettings':'openAutofillSettings']()).catch(()=>toast('Could not open settings'));return false}},...(r.cert?[{label:'Copy fingerprint',fn:()=>{copyText(String(r.cert));toast('Fingerprint copied');return false}}]:[]),{label:'Close'}]);
  }
  else if(action==='sysbattery'){const r=await P.batterySettings();if(!r||!r.ok)throw new Error('Could not open battery settings');}
  else if(action==='sysbatteryask'){
   if(!P.requestBatteryExemption){const r=await P.batterySettings();if(!r||!r.ok)throw new Error('Could not open battery settings');return}
   const r=await P.requestBatteryExemption();
   if(r&&r.already)toast('Festers is already exempt from battery optimisation.');
   else if(!r||!r.ok)throw new Error((r&&r.error)||'Could not ask for the battery exemption');
   else toast(r.direct?'Tap Allow on the Android prompt.':'Find Festers Browser in the list and choose Don\'t optimise.');
  }
  else if(action==='sysafset'){
   if(!P.openAutofillSettings)throw new Error('Needs the new app version');
   const r=await P.openAutofillSettings();if(!r||!r.ok)throw new Error((r&&r.error)||'Could not open autofill settings');
   toast(r.fallback?'Open Settings > Passwords, passkeys & autofill and choose a service.':'Choose your autofill service, then come back.');
  }
  else if(action==='syspagecheck'){await pageCheck()}
  else if(action==='sysinstallcert'){if(!P.openCertSettings)throw new Error('Needs the new app version');const r=await P.openCertSettings();if(!r||!r.ok)throw new Error('Could not open security settings');toast('Open Encryption & credentials > Install a certificate.')}
  else if(action==='sysafstatus'){
   if(!P.autofillStatus)throw new Error('Needs the new app version');
   await afStatusDialog(P); /* V1.23.6: names Conduint, separate On/Off pills */
  }
  else if(action==='sysstatus'){
   const r=await P.status();const y=v=>v?'Yes':'No';
   const notifOn=!!r.notifications&&r.notificationsEnabled!==false;
   modal('Android status',`<p class="mu" style="margin:0 0 6px">Notifications allowed: <b>${y(notifOn)}</b></p><p class="mu" style="margin:0 0 6px">Battery optimisation exempt: <b>${y(r.batteryExempt)}</b></p><p class="mu" style="margin:0 0 6px">Default browser: <b>${y(r.defaultBrowser)}</b></p><p class="mu" style="margin:0 0 6px">Keep-alive running: <b>${y(r.keepAlive)}</b></p><p class="mu" style="margin:0">Android version (API): <b>${esc(String(r.sdk))}</b></p>`,[{label:'Close'}]);
  }
  else if(action==='sysapp'||action==='sysfiles'){const r=await P.appSettings();if(!r||!r.ok)throw new Error('Could not open app settings');}
  else if(action==='syswake'||action==='syswakoff'){
   const enabled=action==='syswake';let r=null;
   if(P.startKeepAlive&&P.stopKeepAlive){
    r=enabled?await P.startKeepAlive():await P.stopKeepAlive();
    if(!enabled)await P.setWakeLock({enabled:false}).catch(()=>{});
    if(enabled&&(!r||!r.ok))r=await P.setWakeLock({enabled:true});
   }else r=await P.setWakeLock({enabled});
   if(!r||!r.ok)throw new Error((r&&r.error)||'Wake lock failed');
   toast(enabled?(r.notificationsOn===false?'Keep-alive is on for up to 4 hours. Allow notifications to see its Stop button.':'Keep-alive is on for up to 4 hours. Use the Stop button in the notification or Disable here.'):'Keep-alive stopped and wake lock released.');
  }
 }catch(e){toast(e.message||'Android setting could not be opened')}
}

/* ---------- internal navigation helper ---------- */
function openInternal(url){
 const same=tabs.find(t=>(t.hist[t.pos]||'').split('#')[0]===url.split('#')[0]);
 if(same){if(url.includes('#'))nav(same,url);switchTab(same.id);return}
 const t=curTab();
 if(t&&t.hist[t.pos]==='about:newtab'&&!t.priv)nav(t,url);else newTab(url);
}

const V={blob:LS.get('vault',null),key:null,items:null,last:0,fails:0,until:0,bioAsked:false};

async function vSave(){

 const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},V.key,enc.encode(JSON.stringify({items:V.items})));
 V.blob.iv=b64(iv);V.blob.ct=b64(ct);LS.set('vault',V.blob);
}
async function vCreate(pw){
 const salt=crypto.getRandomValues(new Uint8Array(16)),iter=600000;
 V.key=await deriveKey(pw,salt,iter);V.items=[];V.blob={v:1,iter,salt:b64(salt),iv:'',ct:''};await vSave();V.last=Date.now();vnClear();
}
async function vUnlock(pw){
 const key=await deriveKey(pw,unb64(V.blob.salt),V.blob.iter);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(V.blob.iv)},key,unb64(V.blob.ct));
 V.items=JSON.parse(dec.decode(pt)).items;V.key=key;V.last=Date.now();
}

async function vBioTry(){
 if(!VNAT||!VN.bioSet)return false;
 try{
  const r=await FBV().bioUnlock();
  if(r&&r.ok){
   try{await vUnlock(r.secret);V.fails=0;renderVault();return true}
   catch(e){await FBV().bioRemove();await vnRefresh();toast('Fingerprint no longer matches this vault. Use your master password');renderVault();return false}
  }
  if(r&&r.err==='invalidated'){await vnRefresh();toast('Your fingerprints changed, so fingerprint unlock was turned off. Use your master password');if(panel==='vault')renderVault();return false}
  if(r&&r.err==='error')toast(r.desc||'Fingerprint failed');
 }catch(e){toast('Fingerprint unavailable')}

}
async function vPinTry(pin){
 try{
  const r=await FBV().pinUnlock({pin});
  if(r&&r.ok){
   try{await vUnlock(r.secret);V.fails=0;renderVault();return}
   catch(e){await FBV().pinRemove();await vnRefresh();toast('That PIN no longer matches this vault. Use your master password');renderVault();return}
  }
  if(r&&r.err==='wiped'){await vnRefresh();toast('Too many wrong PINs. The PIN was erased. Use your master password');renderVault();return}
  if(r&&r.err==='wait'){toast('Wait '+r.wait+'s before trying the PIN again');return}
  if(r&&r.err==='bad'){toast('Wrong PIN · '+r.left+(r.left===1?' try':' tries')+' left');return}

 }catch(e){toast('PIN unavailable')}
}

function cfgFor(it){

async function tickTotp(){
 if(!V.items||panel!=='vault')return;
 for(const el of $$('.vt[data-id]')){
  const it=V.items.find(i=>i.id===el.dataset.id);if(!it)continue;
  const cfg=cfgFor(it),tc=$('.tc',el);
  if(!cfg){tc.textContent='invalid';continue}
  const now=Date.now(),counter=Math.floor(now/1000/cfg.period);
  let c=totpCache.get(it.id);
  if(!c||c.counter!==counter||c.sig!==it.totp){c={counter,sig:it.totp,code:await totpCode(cfg,now)};totpCache.set(it.id,c)}
  const rem=cfg.period-(Math.floor(now/1000)%cfg.period);
  tc.textContent=fmtCode(c.code);
  $('.fg',el).style.strokeDashoffset=(69.1*(1-rem/cfg.period)).toFixed(1);
  el.classList.toggle('warn',rem<=5);
 }
}

const blobData=u=>fetch(u).then(r=>r.blob()).then(b=>b.size>3e5?null:new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})).catch(()=>null);
async function savePage(url){
 const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);
 const doc=new DOMParser().parseFromString(await r.text(),'text/html');
 $$('script,iframe,frame,object,embed,applet,noscript,meta[http-equiv],base',doc).forEach(x=>x.remove());
 $$('*',doc).forEach(x=>[...x.attributes].forEach(a=>{if(/^on/i.test(a.name)||(/^\s*(javascript|data:text\/html)/i.test(a.value)&&/^(href|src|action|formaction)$/i.test(a.name)))x.removeAttribute(a.name)}));
 const abs=v=>{try{return new URL(v,url).href}catch(e){return null}};
 for(const l of $$('link[rel~=stylesheet]',doc).slice(0,8)){const u=abs(l.getAttribute('href'));let css='';try{css=u?await (await fetch(u)).text():''}catch(e){}l.replaceWith(Object.assign(doc.createElement('style'),{textContent:css.replace(/@import[^;]+;/g,'')}))}
 for(const i of $$('img[src]',doc).slice(0,25)){const u=abs(i.getAttribute('src')),d=u&&await blobData(u);if(d)i.setAttribute('src',d);else i.removeAttribute('src');i.removeAttribute('srcset')}
 $$('a[href]',doc).forEach(a=>{const u=abs(a.getAttribute('href'));if(u)a.setAttribute('href',u)});
 const html='<!doctype html>'+doc.documentElement.outerHTML;
 const rec={id:rid(),url,title:(doc.title||host(url)).slice(0,120),t:Date.now(),size:html.length,html};
 await idbDo('readwrite',s=>s.put(rec));return rec;
}

 let rem=1;if(rl){const a=rl.lq?rl.rq/rl.lq:1,b=rl.lt?rl.rt/rl.lt:1;rem=Math.max(0,Math.min(1,Math.min(isNaN(a)?1:a,isNaN(b)?1:b)))}
 const tot=(h.ok||0)+(h.fail||0),suc=tot?(h.ok||0)/tot:1,lat=!h.ms?1:h.ms<900?1:h.ms<2500?.6:.3;
 let s=Math.round(100*(.5*rem+.3*suc+.2*lat));if(h.until>now)s=Math.min(s,20);if(h.status==='down')s=Math.min(s,40);return s}
const gkCol=s=>s==null?'var(--bd)':s>=70?'#22c55e':s>=40?'#f59e0b':'#ef4444';
const gkMask=k=>k.length<12?'••••':k.slice(0,4)+'••••••••'+k.slice(-4);
const gkNum=n=>n==null?'?':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':String(n);
const gkAgo=t=>{if(!t)return 'never';const s=Math.max(0,Math.round((Date.now()-t)/1000));return s<60?'just now':s<3600?Math.floor(s/60)+' min ago':s<86400?Math.floor(s/3600)+' h ago':Math.floor(s/86400)+' d ago'};
const gkActive=()=>{const L=gkList();return L.find(k=>k.id===S.groqKeyId)||L[0]||null};
function gkOrder(){const L=gkList(),h=gkHealth(),now=Date.now(),a=gkActive();
 const okK=k=>{const x=h[k.id]||{};return x.status!=='bad'&&!(x.until>now)};
 const rest=L.filter(k=>!a||k.id!==a.id).sort((x,y)=>(gkScore(h[y.id])??50)-(gkScore(h[x.id])??50));
 return (a?[a].concat(rest):rest).filter(okK)}
function gkModels(){const c=LS.get('groqModels',null),l=Array.isArray(c)&&c.length?c:GROQ.models;return l.includes(S.groqModel)?l:[S.groqModel].concat(l)}
async function gkFetchModels(k){const r=await fetch(GROQ.api+'/models',{headers:{Authorization:'Bearer '+k.pass}});if(!r.ok)return r;
 try{const j=await r.clone().json(),l=(j.data||[]).map(m=>m.id).filter(id=>id&&!/whisper|tts|guard|playai|orpheus|embed|safeguard/i.test(id)).sort();if(l.length)LS.set('groqModels',l)}catch(e){}return r}
async function gkTest(k){
 const t0=Date.now();let st='ok',err='';
 try{const r=await gkFetchModels(k),ms=Date.now()-t0;
  if(r.status===401||r.status===403){gkMark(k.id,false,{status:'bad',err:'Key rejected',ms});return 'bad'}
  if(r.status===429){gkMark(k.id,false,{status:'ok',until:Date.now()+60000,err:'Rate limited',ms});return 'lim'}
  if(!r.ok){gkMark(k.id,false,{status:'down',err:'Groq answered '+r.status,ms});return 'warn'}
  gkMark(k.id,true,{status:'ok',err:'',ms});
  const t1=Date.now(),c=await fetch(GROQ.api+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+k.pass},body:JSON.stringify({model:S.groqModel,messages:[{role:'user',content:'ok'}],max_tokens:1})});
  gkRL(k.id,c,Date.now()-t1);if(c.status===429)gkMark(k.id,false,{status:'ok',until:Date.now()+60000,err:'Rate limited'});
 }catch(e){gkMark(k.id,false,{status:'down',err:'No connection'});return 'warn'}
 return st}

/* chat with rotation: if a key is rejected or rate limited, the next healthy key takes over */
async function groqChat0(msgs,o){
 o=o||{};
 if(!gkList().length)throw new GErr('nokey','No Groq key yet. Add one under Settings > Groq AI & Keys.');
 let keys=gkOrder();if(!keys.length)throw new GErr('allbad','Every saved key is rejected or rate limited right now. Check Key health in Settings.');
 if(!S.groqRotate)keys=keys.slice(0,1);
 let last=null;
 for(const k of keys){
  const t0=Date.now();let r;
  try{r=await fetch(GROQ.api+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+k.pass},body:JSON.stringify(Object.assign({model:o.model||S.groqModel,messages:msgs,temperature:o.temp==null?.4:o.temp,max_tokens:o.max||1200,stream:false},/^openai\/gpt-oss/.test(o.model||S.groqModel)?{reasoning_effort:'low'}:{}))})}
  catch(e){gkMark(k.id,false,{status:'down',err:'No connection'});throw new GErr('net','Could not reach Groq. Check your connection or VPN.')}
  const ms=Date.now()-t0;gkRL(k.id,r,ms);
  if(r.ok){let j=null;try{j=await r.json()}catch(e){}
   const tx=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
   if(!tx){gkMark(k.id,false,{status:'ok',err:'Empty reply',ms});last=new GErr('empty','Groq sent an empty reply. Try again.');continue}
   gkMark(k.id,true,{status:'ok',err:'',ms});return {text:String(tx).trim(),key:k,model:j.model||o.model||S.groqModel}}
  let msg='';try{const j=await r.json();msg=(j.error&&j.error.message)||''}catch(e){}
  if(r.status===401||r.status===403){gkMark(k.id,false,{status:'bad',err:'Key rejected ('+r.status+')'});last=new GErr('auth','Groq rejected the key "'+(k.label||k.title)+'".');continue}
  if(r.status===429){let ra=0;try{ra=parseFloat(r.headers.get('retry-after'))||0}catch(e){}gkMark(k.id,false,{status:'ok',until:Date.now()+Math.max(15,Math.min(ra||60,900))*1000,err:'Rate limited'});last=new GErr('rate','The key "'+(k.label||k.title)+'" hit its rate limit.');continue}
  if(r.status>=500){gkMark(k.id,false,{status:'down',err:'Groq server '+r.status});last=new GErr('down','Groq is having trouble ('+r.status+'). Try again shortly.');continue}
  throw new GErr('http','Groq says: '+(msg||'error '+r.status)+(/model/i.test(msg)?' Pick another model in Settings > Groq AI & Keys.':''))}
 throw last||new GErr('down','Groq did not answer.')}
const groqErrText=e=>e&&e.message?e.message:'Groq did not answer.';
/* V1.22.3: if Groq says the model is gone, read the live model list once, switch to the first current one and retry. */
const GROQ_PREF=['openai/gpt-oss-120b','openai/gpt-oss-20b','qwen/qwen3.8-27b'];
async function groqChat(msgs,o){
 o=o||{};
 try{return await groqChat0(msgs,o)}
 catch(e){
  if(!(e&&e.code==='http'&&/model|decommission|not found|does not exist|no longer/i.test(e.message||''))||o._fb)throw e;
  try{
   const k=gkOrder()[0];
   if(k){await gkFetchModels(k);
    const L=LS.get('groqModels',[])||[],cur=o.model||S.groqModel,pick=GROQ_PREF.find(m=>L.includes(m)&&m!==cur)||L.find(m=>m!==cur&&/gpt-oss|qwen|llama/i.test(m));
    if(pick){setS('groqModel',pick);toast('Groq model switched to '+pick);return await groqChat0(msgs,Object.assign({},o,{model:pick,_fb:1}))}}
  }catch(e2){}
  throw e}}

let AIH=S.groqSave?LS.get('aiChat',[]):[],aiDraw=()=>{},aiBusy=false;

async function aiSend(q,ctx,kind){
 if(aiBusy)return;
 const rq=S.groqRedact?redact(q):{text:q,n:0},rc=ctx?(S.groqRedact?redact(ctx):{text:ctx,n:0}):{text:'',n:0};
 AIH.push({role:'user',content:q,api:rc.text?rq.text+'\n\n'+rc.text:rq.text,hid:rq.n+rc.n});
 aiBusy=true;aiDraw(true);
 try{
  const hist=AIH.filter(m=>m.role==='user'||m.role==='assistant').slice(-10),lastI=hist.length-1;
  const msgs=hist.map((m,i)=>({role:m.role,content:m.role==='user'?(i===lastI?m.api:(S.groqRedact?redact(m.content).text:m.content)):m.content}));
  const out=await aiRun(kind||(!ctx&&q.length<=40?'quick':'chat'),[{role:'system',content:AI_SYS}].concat(msgs));
  AIH.push({role:'assistant',content:out.text,key:out.key.label||out.key.title,model:out.model,prov:out.prov,note:out.note||''});
 }catch(e){AIH.push({role:'err',content:groqErrText(e),code:e.code||'err'})}
 aiBusy=false;AIH=AIH.slice(-40);aiStore();aiDraw(false);
}
function aiHook(v,o){if(!S.aiSearch||!o||!o.user)return false;const m=/^(\?|!ai\s+|!groq\s+|ai:\s*)(.+)$/i.exec(String(v).trim());if(!m)return false;openPanel('ai',true);aiSend(m[2]);return true}
async function pageText(u,max){

 const doc=new DOMParser().parseFromString(await r.text(),'text/html');
 $$('script,style,nav,header,footer,aside,form,iframe,noscript,svg,button,select',doc).forEach(x=>x.remove());
 const root=$('article',doc)||$('main',doc)||$('[role=main]',doc)||doc.body;
 const tx=[...root.querySelectorAll('h1,h2,h3,p,li,blockquote')].map(x=>x.textContent.replace(/\s+/g,' ').trim()).filter(s=>s.length>20).join('\n');
 return {title:(doc.title||'').slice(0,120),text:tx.slice(0,max||6000)}}

function dlLine(d){
 const st=d.state,sz=fSize(d.total>0?d.total:(d.bytes||0));
 if(st==='completed')return 'Saved in '+(d.path||'Downloads')+' · '+sz;
 if(st==='failed')return 'Failed: '+(d.error||d.desc||'unknown error');
 if(st==='paused')return 'Paused'+(d.total>0?' at '+dlPct(d)+'%':'')+' · '+fSize(d.bytes||0)+(d.total>0?' of '+fSize(d.total):'')+(d.error&&d.error!=='Paused'?' · '+d.error:'');
 if(st==='queued')return 'Waiting to start…';
 if(st==='saving')return 'Saving into Downloads…';
 return (d.total>0?dlPct(d)+'% · ':'')+fSize(d.bytes||0)+(d.total>0?' of '+fSize(d.total):'')+(d.speed>0?' · '+fSize(d.speed)+'/s':'')+(dlEta(d)?' · '+dlEta(d):'');
}
function dlBtns(d){
 const b=(a,l,c)=>`<button class="btn sm ${c||''}" data-dla="${a}" data-id="${d.id}">${l}</button>`,st=d.state;
 if(st==='downloading'||st==='queued')return b('pause','Pause')+b('cancel','Cancel','bad');
 if(st==='saving')return '';
 if(st==='paused')return b('resume','Resume','pri')+b('cancel','Cancel','bad');
 if(st==='failed')return b('resume','Retry','pri')+b('rm','Remove');
 return b('open','Open','pri')+b('copy','Copy link')+b('del','Delete file','bad')+b('rm','Remove');
}
function dlRow(d){
 const p=dlPct(d),ind=dlLive(d)&&!(d.total>0)&&d.state!=='queued';
 const big=d.state==='completed'?'Done':(d.total>0&&d.state!=='failed'?p+'%':'');
 return `<div class="dlr ${esc(d.state)}" data-dj="${d.id}"><div class="dlh"><div class="dlt"><b>${esc(d.name||'Download')}</b><small data-dls>${esc(dlLine(d))}</small></div><span class="dlp" data-dlp>${big}</span></div><div class="dlbar ${ind?'ind':''}"><i data-dlb style="width:${ind?35:p}%"></i></div><div class="acts dla">${dlBtns(d)}</div></div>`;
}
function dlBadge(){try{const n=DL.jobs.filter(dlLive).length,b=$('#rail .rb[data-p="dl"]');if(b){if(n)b.setAttribute('data-n',n>9?'9+':String(n));else b.removeAttribute('data-n')}}catch(e){}}
function dlConfig(){try{if(NAT)FBW().dlConfig({wifiOnly:!!S.dlWifi})}catch(e){}}
async function dlRefresh(){
 if(!NAT)return false;
 try{const r=await FBW().downloadJobs(),a=(r&&r.jobs)||[];const before=JSON.stringify(DL.jobs.map(x=>[x.id,x.state,x.bytes]));DL.jobs=a;dlBadge();return before!==JSON.stringify(a.map(x=>[x.id,x.state,x.bytes]))}catch(e){return false}
}
async function dlInit(){
 dlConfig();await dlRefresh();
 try{FBW().addListener('dlprogress',dlOnEvent)}catch(e){} /* live progress from the native download engine */
 try{FBW().dlResumeNet()}catch(e){} /* downloads that were running when the app closed, or that lost the connection, continue now */
 addEventListener('online',()=>{try{FBW().dlResumeNet()}catch(e){}});
}
function dlOnEvent(e){
 if(!e||e.id==null)return;
 const i=DL.jobs.findIndex(x=>x.id===e.id);
 if(e.state==='removed'||e.status==='removed'){if(i>=0)DL.jobs.splice(i,1);dlBadge();if(panel==='dl'&&DL.tab==='dl')renderDl();return}
 const prev=i>=0?DL.jobs[i]:null;
 if(i>=0)DL.jobs[i]=e;else DL.jobs.unshift(e);
 dlBadge();
 if(panel!=='dl'||DL.tab!=='dl')return;
 const row=$(`[data-dj="${e.id}"]`);
 if(row&&prev&&prev.state===e.state){ /* same state: update the numbers in place, no flicker */
  const s=$('[data-dls]',row),p=$('[data-dlp]',row),bar=$('[data-dlb]',row),nm=$('.dlt b',row),ind=dlLive(e)&&!(e.total>0)&&e.state!=='queued';
  if(s)s.textContent=dlLine(e);
  if(nm&&e.name&&nm.textContent!==e.name)nm.textContent=e.name;
  if(p)p.textContent=e.state==='completed'?'Done':(e.total>0&&e.state!=='failed'?dlPct(e)+'%':'');
  if(bar){bar.style.width=(ind?35:dlPct(e))+'%';bar.parentNode.classList.toggle('ind',ind)}
  return;
 }
 renderDl();
}

 }
 el.innerHTML=tabs+body;
 $$('[data-dt]',el).forEach(b=>b.onclick=()=>{DL.tab=b.dataset.dt;renderDl();if(DL.tab==='dl')dlRefresh().then(ch=>{if(ch&&panel==='dl'&&DL.tab==='dl')renderDl()})});

 $('#dlall',el).onclick=async()=>{let n=0;for(const d of DL.jobs.filter(x=>x.state==='paused'||x.state==='failed')){try{const r=await F.dlResume({id:d.id});if(r&&r.ok)n++}catch(err){}}toast(n?'Resumed '+n:'Nothing to resume')};
 $('#dlclr',el).onclick=async()=>{try{const r=await F.dlClear();await dlRefresh();renderDl();toast((r&&r.n)||0?'Cleared '+r.n:'Nothing to clear')}catch(err){}};

/* ---------- JSON import from password managers ---------- */
function jsonLogins(d){
 const out=[],st={skipped:0,enc:false,fmt:''};
 const s=v=>v==null?'':(typeof v==='object'?'':String(v)).trim();
 const add=o=>{
  o.title=s(o.title);o.url=s(o.url);o.user=s(o.user);o.pass=s(o.pass);o.totp=s(o.totp);o.notes=s(o.notes);o.folder=s(o.folder);
  if(o.note){if(!o.title&&!o.notes){st.skipped++;return}out.push(o);return}
  if(!o.user&&!o.pass){st.skipped++;return}
  out.push(o);
 };
 const firstUrl=u=>{if(Array.isArray(u)){const f=u[0];return f?(typeof f==='string'?f:(f.uri||f.url||'')):''}return u||''};
 const lc=o=>{const m={};Object.keys(o||{}).forEach(k=>{m[k.toLowerCase().replace(/[\s_-]/g,'')]=o[k]});return m};
 if(d&&d.encrypted===true){st.enc=true;return {out,st}}
 /* Bitwarden (and Vaultwarden): {folders:[],items:[{type,name,login:{uris,username,password,totp},notes,fields}]} */
 if(d&&Array.isArray(d.items)&&d.items.length&&d.items.some(i=>i&&(i.login||i.secureNote||i.card||i.identity))){
  st.fmt='Bitwarden';const fo={};(d.folders||[]).forEach(f=>{if(f&&f.id)fo[f.id]=f.name});
  d.items.forEach(i=>{
   if(!i)return;
   const cf=(i.fields||[]).map(f=>s(f.name)+': '+s(f.value)).join('\n');
   if(i.login)add({title:i.name,url:firstUrl(i.login.uris),user:i.login.username,pass:i.login.password,totp:i.login.totp,notes:i.notes,folder:fo[i.folderId]||'',fav:i.favorite?'1':'',cf});
   else if(i.secureNote||i.type===2)add({note:1,title:i.name,notes:i.notes,folder:fo[i.folderId]||''});
   else st.skipped++;
  });
  return {out,st};
 }
 /* 1Password export.data (inside a .1pux): {accounts:[{vaults:[{items:[{overview,details}]}]}]} */
 if(d&&Array.isArray(d.accounts)){
  st.fmt='1Password';
  d.accounts.forEach(a=>(a.vaults||[]).forEach(v=>(v.items||[]).forEach(i=>{
   if(!i||i.trashed)return;const ov=i.overview||{},de=i.details||{},lf=de.loginFields||[];
   const pick=n=>{const f=lf.find(x=>x.designation===n);return f?f.value:''};
   let totp='';(de.sections||[]).forEach(sec=>(sec.fields||[]).forEach(f=>{if(f.value&&f.value.totp&&!totp)totp=f.value.totp}));
   if(i.categoryUuid==='003'||(!lf.length&&de.notesPlain&&!ov.url))add({note:1,title:ov.title,notes:de.notesPlain,folder:v.attrs&&v.attrs.name||''});
   else add({title:ov.title,url:ov.url||firstUrl((ov.urls||[]).map(u=>u.url)),user:pick('username'),pass:pick('password')||(de.password||''),totp,notes:de.notesPlain,folder:v.attrs&&v.attrs.name||''});
  })));
  return {out,st};
 }
 /* Proton Pass: {vaults:{id:{name,items:[{data:{type,metadata,content}}]}}} */
 if(d&&d.vaults&&!Array.isArray(d.vaults)&&typeof d.vaults==='object'){
  st.fmt='Proton Pass';
  Object.keys(d.vaults).forEach(k=>{const v=d.vaults[k];(v.items||[]).forEach(i=>{
   const x=i&&i.data;if(!x)return;const c=x.content||{},m=x.metadata||{};
   if(x.type==='login')add({title:m.name,url:firstUrl(c.urls||c.url),user:c.itemUsername||c.username||c.itemEmail||c.email,pass:c.password,totp:c.totpUri||c.totp,notes:m.note,folder:v.name});
   else if(x.type==='note')add({note:1,title:m.name,notes:m.note,folder:v.name});
   else st.skipped++;
  })});
  return {out,st};
 }
 /* Dashlane: {AUTHENTIFIANT:[...],SECURENOTE:[...]} */
 if(d&&(Array.isArray(d.AUTHENTIFIANT)||Array.isArray(d.SECURENOTE))){
  st.fmt='Dashlane';
  (d.AUTHENTIFIANT||[]).forEach(i=>add({title:i.title||i.domain,url:i.url||i.domain,user:i.login||i.email||i.secondaryLogin,pass:i.password,notes:i.note}));
  (d.SECURENOTE||[]).forEach(i=>add({note:1,title:i.title,notes:i.content||i.note}));
  return {out,st};
 }
 /* Keeper: {records:[{title,login,password,login_url,notes,custom_fields}]} */
 if(d&&Array.isArray(d.records)&&d.records.some(r=>r&&(r.login!==undefined||r.password!==undefined))){
  st.fmt='Keeper';
  d.records.forEach(r=>add({title:r.title,url:r.login_url||r.url,user:r.login,pass:r.password,notes:r.notes,folder:Array.isArray(r.folders)&&r.folders[0]?(r.folders[0].folder||r.folders[0].shared_folder||''):'',totp:r.custom_fields&&(r.custom_fields['TFC:Keeper']||r.custom_fields.totp||'')}));
  return {out,st};
 }
 /* Enpass: {items:[{title,category,note,fields:[{type,value}]}]} */
 if(d&&Array.isArray(d.items)&&d.items.length&&d.items.some(i=>i&&Array.isArray(i.fields)&&i.category)){
  st.fmt='Enpass';
  d.items.forEach(i=>{const f=t=>{const x=(i.fields||[]).find(y=>y.type===t&&y.value);return x?x.value:''};
   if(i.category==='note')add({note:1,title:i.title,notes:i.note});
   else if(['login','password'].includes(i.category))add({title:i.title,url:f('url'),user:f('username')||f('email'),pass:f('password'),totp:f('totp'),notes:i.note});
   else st.skipped++});
  return {out,st};
 }
 /* Anything else (KeePass, Chrome-style, hand-made files, other managers): walk the file and take every object that has a password plus a username, address or title. */
 st.fmt='JSON';
 const KS={title:['name','title','site','label','sitename','entryname','account','service'],url:['url','uri','website','loginuri','origin','domain','link','web','address','loginurl'],
  user:['username','user','login','loginusername','email','usernameoremail','userid','id','accountname','useremail'],pass:['password','pass','loginpassword','pwd','passwd'],
  totp:['totp','otp','otpauth','logintotp','twofactor','mfa','totpuri','totpsecret'],notes:['notes','note','comment','comments','extra','memo','description'],folder:['folder','group','category','vault','path']};
 const get=(m,k)=>{for(const n of KS[k]){if(m[n]!==undefined&&m[n]!==null&&typeof m[n]!=='object'&&String(m[n]).trim()!=='')return m[n]}return ''};
 const seen=new Set();let n=0;
 const walk=(o,depth)=>{
  if(!o||typeof o!=='object'||depth>8||n>20000||seen.has(o))return;seen.add(o);
  if(Array.isArray(o)){o.forEach(x=>walk(x,depth+1));return}
  const m=lc(o),pw=get(m,'pass');
  if(pw){n++;add({title:get(m,'title'),url:get(m,'url'),user:get(m,'user'),pass:pw,totp:get(m,'totp'),notes:get(m,'notes'),folder:get(m,'folder')});return}
  Object.keys(o).forEach(k=>walk(o[k],depth+1));
 };
 walk(d,0);
 return {out,st};
}
async function vJson(){
 if(!needUnlocked())return;
 if(!await confirmBox('A password export is plain text: anyone who gets the file can read every password. Import it, then delete the file from your phone. Choose the file now?','Choose file'))return;
 const txt=await pickFile('.json,application/json,text/plain,.txt');if(!txt)return;
 if(/^PK/.test(txt.slice(0,2)))return modal('This is a zip',`<p style="margin:0">1Password .1pux files are zip files. Unzip it, then choose the file named <b>export.data</b> inside.</p>`,[{label:'OK',cls:'pri'}]);
 let d;try{d=JSON.parse(txt.replace(/^﻿/,''))}catch(e){return modal('Not a JSON file',`<p style="margin:0">This file is not valid JSON. If it is a CSV export (Chrome, LastPass, NordPass, KeePassXC), use <b>Import CSV</b> instead.</p>`,[{label:'OK',cls:'pri'}])}
 const r=jsonLogins(d);
 if(r.st.enc)return modal('Encrypted export',`<p style="margin:0">This export is encrypted, so Festers cannot read it. Export it again without encryption (in Bitwarden choose <b>.json</b>, not <b>.json (Encrypted)</b>), import that file, then delete it.</p>`,[{label:'OK',cls:'pri'}]);
 let added=0,notes=0,dups=0,badTotp=0;
 r.out.forEach(o=>{
  let it;
  if(o.note){it={id:rid(),kind:'note',title:o.title||'Imported note',user:'',pass:'',totp:'',notes:o.notes,created:Date.now(),updated:Date.now()};
   if(V.items.some(x=>x.kind==='note'&&x.title===it.title&&x.notes===it.notes)){dups++;return}V.items.push(it);notes++;return}
  it={id:rid(),title:o.title||host(resolve(o.url))||'Imported',url:o.url,user:o.user,pass:o.pass,totp:o.totp,notes:o.notes,folder:o.folder||'',fav:o.fav||'',cf:o.cf||'',reprompt:'',created:Date.now(),updated:Date.now()};
  if(it.totp&&!parseTotp(it.totp)){it.totp='';badTotp++}
  if(V.items.some(x=>!x.kind&&x.title===it.title&&x.user===it.user&&x.url===it.url)){dups++;return}
  V.items.push(it);added++;
 });
 if(!added&&!notes){return modal('Nothing imported',`<p style="margin:0">No logins were found in this file${r.st.fmt?' ('+esc(r.st.fmt)+' format)':''}.${dups?' '+dups+' were already in the vault.':''}${r.st.skipped?' '+r.st.skipped+' items such as cards and identities are not imported.':''}</p>`,[{label:'OK',cls:'pri'}])}

 <p><b>Your IP address.</b> Your IP address is the number that tells every website where to send its answer. It points to your internet provider and roughly to your town, and it is logged by every site, advert network and Wi-Fi hotspot you touch. It lets companies link your visits into one profile and lets attackers find your network, probe it for weak devices, flood it with junk traffic or pick targets for scams. On public Wi-Fi anyone on the same network can watch unprotected traffic. A VPN, HTTPS-only mode and tracker blocking shrink what is exposed.</p>

/* ---------- V1.26.0: Browser lock (4-digit PIN + fingerprint) ----------
   The lock is a cover over the whole app. Green glowing lock on the Security posture panel = open, red = locked. Tap green to lock, tap red (or the big
   lock on the cover) to get the PIN pad and the fingerprint prompt. Kill Switch locks it when it finishes. No timers: it never locks by itself while
   the browser is in use; it only starts locked when the app is opened from closed (switch in Settings > Browser Lock). No reset: forgetting the PIN with
   no fingerprint means clearing the app data, which erases everything. */
const LKC=()=>LS.get('lockCfg',null);
const lkEnabled=()=>{const c=LKC();return !!(c&&c.h)};
const lkBio=()=>{const c=LKC();return !!(c&&c.bio)};
let lkLocked=false,lkBusy=false;
async function lkHash(pin,salt){
 try{
  const enc=new TextEncoder(),k=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode(salt),iterations:150000},k,256);
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
 }catch(e){ /* no WebCrypto: a weaker iterated hash so the lock still works */
  let h=5381;const t=salt+':'+pin;for(let r=0;r<5000;r++){for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i)+r)|0}
  return 'f'+(h>>>0).toString(16);
 }
}
const lkSalt=()=>{try{return Array.from(crypto.getRandomValues(new Uint8Array(12))).map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return String(Date.now())+Math.random().toString(16).slice(2)}};
async function lkCheck(pin){const c=LKC();if(!c||!c.h)return false;return (await lkHash(pin,c.s))===c.h}
async function lkBioOk(){try{if(!VNAT)return false;const r=await FBV().status();return !!(r&&r.bio&&r.bio!=='none')}catch(e){return false}}
async function lkFinger(title){try{const r=await FBV().lockAuth({title:title||'Unlock Festers Browser'});return !!(r&&r.ok)}catch(e){return false}}
const lkFails=()=>LS.get('lockFail',{n:0,until:0});
const lkMsg=t=>{const m=$('#lkmsg');if(m)m.textContent=t||''};
function lkRefresh(){
 try{const t=curTab();if(t&&t.el&&$('.dash',t.el))renderNewTab(t)}catch(e){}
 try{const t=curTab();if(t&&t.el&&/^about:preferences/.test(t.hist[t.pos]||'')&&t.prefOpen&&t.prefSec==='lock')renderPrefs(t,'lock')}catch(e){}
}
function lkChipHtml(){
 const en=lkEnabled(),st=!en?'off':(lkLocked?'locked':'on');
 const tt=!en?'Browser lock is off. Tap to set it up':(lkLocked?'Locked. Tap to unlock':'Unlocked. Tap to lock');
 return `<button type="button" class="lkchip ${st}" data-d="lock" title="${tt}" aria-label="${tt}">${ic('lock',17)}</button>`;
}
async function lkFingerGo(){
 if(!lkBio()){lkMsg('Fingerprint is off. Use your PIN.');return}
 if(lkBusy)return;lkBusy=true;
 try{if(await lkFinger('Unlock Festers Browser'))lkUnlock();else lkMsg('Fingerprint not accepted. Use your PIN.')}finally{lkBusy=false}
}
function lkShow(){
 if($('#fblock'))return;
 const fp='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 4a7 7 0 0 1 7 7v2"/><path d="M5 11a7 7 0 0 1 3-5.7"/><path d="M8 20c1-2 1-4 1-6a3 3 0 0 1 6 0c0 3 .5 5 1.5 7"/><path d="M12 14c0 2.5-.3 4.5-1.2 6.5"/><path d="M5 14v2"/></svg>';
 const d=document.createElement('div');d.id='fblock';d.setAttribute('role','dialog');d.setAttribute('aria-label','Browser locked');
 d.innerHTML=`<div class="lkbox"><button type="button" class="lkbig" data-k="bio" aria-label="Unlock">${ic('lock',44)}</button><b>Festers Browser is locked</b><small class="mu">Bojack Security · tap the lock or enter your PIN</small><div class="lkdots"><i></i><i></i><i></i><i></i></div><div class="lkmsg" id="lkmsg"></div><div class="lkpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-k="${n}">${n}</button>`).join('')}<button type="button" data-k="bio" aria-label="Fingerprint">${fp}</button><button type="button" data-k="0">0</button><button type="button" data-k="del" aria-label="Delete">&#9003;</button></div></div>`;
 document.body.appendChild(d);
 let buf='';
 const dots=()=>Array.from(d.querySelectorAll('.lkdots i')).forEach((e,i)=>e.classList.toggle('on',i<buf.length));
 const tryPin=async()=>{
  const f=lkFails(),now=Date.now();
  if(f.until>now){lkMsg('Too many tries. Wait '+Math.ceil((f.until-now)/1000)+' s');buf='';dots();return}
  const pin=buf;
  if(await lkCheck(pin)){LS.set('lockFail',{n:0,until:0});lkUnlock();return}
  const n=(f.n||0)+1;LS.set('lockFail',n>=5?{n:0,until:now+30000}:{n:n,until:0});
  lkMsg(n>=5?'Wrong PIN. Wait 30 s':'Wrong PIN');buf='';dots();
  d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');
  try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
 };
 d.onclick=e=>{
  const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;
  if(k==='bio'){lkFingerGo();return}
  if(k==='del'){buf=buf.slice(0,-1);dots();lkMsg('');return}
  if(buf.length>=4)return;
  buf+=k;dots();if(buf.length===4)tryPin();
 };
}
function lkLock(){
 if(!lkEnabled())return;
 lkLocked=true;LS.set('locked',true);
 try{if(panel)closePanel()}catch(e){}
 try{const bg=$('#mbg');if(bg){bg.classList.remove('on');bg.innerHTML=''}}catch(e){}
 try{const m=$('#menu.on');if(m)m.classList.remove('on')}catch(e){}
 lkShow();nsSched();lkRefresh();
 if(lkBio())setTimeout(()=>{if(lkLocked)lkFingerGo()},500);
}
function lkUnlock(){
 lkLocked=false;LS.set('locked',false);
 const d=$('#fblock');if(d)d.remove();
 nsSched();lkRefresh();toast('Unlocked');
}
function lkChip(){
 if(!lkEnabled()){openInternal('about:preferences#lock');return}
 if(lkLocked){lkShow();lkFingerGo();return}
 lkLock();
}
function lkPinDialog(){
 const en=lkEnabled(),inp=(id,ph)=>`<input class="in lkin" id="${id}" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="${ph}" style="margin:4px 0">`;
 modal(en?'Change PIN':'Set a 4-digit PIN',`${en?inp('lk0','Current PIN'):''}${inp('lk1','New 4-digit PIN')}${inp('lk2','Repeat new PIN')}<p class="mu" style="margin:8px 0 0"><small>There is no reset. If you forget the PIN and cannot use your fingerprint, the only way back in is clearing the app data, which erases everything.</small></p>`,
 [{label:'Cancel'},{label:'Save',cls:'pri',fn:async m=>{
  const v=id=>{const e=$('#'+id,m);return e?e.value.trim():''};
  if(en&&!(await lkCheck(v('lk0')))){toast('Current PIN is wrong');return false}
  const p1=v('lk1'),p2=v('lk2');
  if(!/^\d{4}$/.test(p1)){toast('The PIN must be exactly 4 digits');return false}
  if(p1!==p2){toast('The two PINs do not match');return false}
  const s=lkSalt(),h=await lkHash(p1,s),old=LKC()||{};
  LS.set('lockCfg',{s:s,h:h,bio:!!old.bio});LS.set('lockFail',{n:0,until:0});
  toast(en?'PIN changed':'Browser lock is on');lkRefresh();
 }}]);
}
async function lkAct(a){
 if(a==='lkpin'){lkPinDialog();return}
 if(a==='lknow'){if(!lkEnabled())toast('Set a PIN first');else lkLock();return}
 if(a==='lkbio'){
  if(!lkEnabled()){toast('Set a PIN first');return}
  if(lkBio()){const c=LKC();c.bio=false;LS.set('lockCfg',c);toast('Fingerprint off');lkRefresh();return}
  if(!(await lkBioOk())){toast('No fingerprint is enrolled on this phone');return}
  if(await lkFinger('Turn on fingerprint unlock')){const c=LKC();c.bio=true;LS.set('lockCfg',c);toast('Fingerprint on');lkRefresh()}else toast('Fingerprint was not confirmed');
  return;
 }
 if(a==='lkoff'){
  if(!lkEnabled()){toast('The lock is already off');return}
  modal('Remove browser lock','<input class="in lkin" id="lk0" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="Current PIN">',
   [{label:'Cancel'},{label:'Remove',cls:'bad',fn:async m=>{
    const e=$('#lk0',m);if(!(await lkCheck(e?e.value.trim():''))){toast('PIN is wrong');return false}
    LS.set('lockCfg',null);LS.set('locked',false);lkLocked=false;toast('Browser lock removed');lkRefresh();
   }}]);
 }
}
(()=>{ /* start locked when the app is opened from closed (or when a Kill Switch lock was never opened) */
 if(!lkEnabled()){LS.set('locked',false);return}
 if(LS.get('locked',false)||S.lockOpen!==false)lkLock();
})();
})();
</script>
