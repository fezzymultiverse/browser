name: Build Signed APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        npm install
        npm install -g @capacitor/cli

    - name: Patch Android
      run: |
        bash scripts/patch-android.sh

    - name: Build Android
      run: |
        npx cap add android
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Sign APK
      run: |
        echo "$KEYSTORE_B64" | base64 -d > my.keystore
        BT=$(ls $ANDROID_HOME/build-tools/* | sort -V | tail -1)
        UNSIGNED=$(ls android/app/build/outputs/apk/release/*-unsigned.apk | head -1)
        $BT/zipalign -p -f 4 "$UNSIGNED" aligned.apk
        $BT/apksigner sign --ks my.keystore --ks-pass env:KEYSTORE_PASS --ks-key-alias "$KEY_ALIAS" --out signed-app.apk aligned.apk
      env:
        KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: signed-app
        path: signed-app.apk
      - name: Publish GitHub Release (for Obtainium)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "${{ github.event.repository.name }}.apk"
          gh release create "V${{ github.run_number }}" "${{ github.event.repository.name }}.apk" \
            --title "V${{ github.run_number }}" --notes "Signed build ${{ github.sha }}"
